name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first: CI should report on the
# tip, not on a commit nobody is waiting for any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each step runs even if an earlier one failed: one push should report
      # every problem it introduced, not just the first.
      - name: Format
        if: '!cancelled()'
        run: npm run format:check

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Unit and component tests
        if: '!cancelled()'
        run: npm run test

      - name: Build
        if: '!cancelled()'
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium only: the game needs a physical keyboard and 1024px, so the
      # other browsers would be testing the same desktop path twice.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
